<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta property="og:url" content="https://www.linkedin.com/in/md-sajid-alam-3708352b7" />
  <meta property="og:image" content="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=600&q=80" />

  <!-- Font Awesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* -------------------------------------------------------------------------- */
    /* ROOT VARIABLES & CSS RESET                                                 */
    /* -------------------------------------------------------------------------- */
    :root {
      --bg-dark: #0a0e17;
      --bg-card: rgba(16, 23, 42, 0.65);
      --bg-card-hover: rgba(30, 41, 59, 0.75);
      --border-color: rgba(56, 189, 248, 0.15);
      --border-glow: rgba(56, 189, 248, 0.4);
      
      --accent-blue: #2563eb;
      --accent-cyan: #38bdf8;
      --accent-teal: #14b8a6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --gradient-primary: linear-gradient(135deg, #2563eb 0%, #38bdf8 100%);
      --gradient-glow: linear-gradient(135deg, rgba(37, 99, 235, 0.3) 0%, rgba(56, 189, 248, 0.3) 100%);
      
      --font-main: 'Inter', system-ui, -apple-system, sans-serif;
      --font-code: 'Fira Code', monospace;
      
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --bg-dark: #f8fafc;
      --bg-card: rgba(255, 255, 255, 0.75);
      --bg-card-hover: rgba(241, 245, 249, 0.85);
      --border-color: rgba(37, 99, 235, 0.15);
      --border-glow: rgba(37, 99, 235, 0.4);
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #64748b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-main);
      line-height: 1.6;
      overflow-x: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* Custom Cursor */
    .cursor-dot, .cursor-outline {
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      border-radius: 50%;
      opacity: 0;
      transform: translate(-50%, -50%);
      transition: opacity 0.3s ease-in-out, transform 0.15s ease-out;
      z-index: 9999;
    }
    .cursor-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-cyan);
    }
    .cursor-outline {
      width: 36px;
      height: 36px;
      border: 1.5px solid var(--accent-cyan);
    }

    /* Scroll Progress Bar */
    #scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: var(--gradient-primary);
      width: 0%;
      z-index: 10000;
      transition: width 0.1s ease-out;
    }

    /* Canvas Background */
    #canvas-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.6;
      pointer-events: none;
    }

    /* Utility Classes */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .section {
      padding: 6rem 0;
    }

    .section-title {
      font-size: 2.25rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    .section-title span {
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section-subtitle {
      text-align: center;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 4rem auto;
      font-size: 1rem;
    }

    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2rem;
      transition: var(--transition);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    }

    .glass-card:hover {
      border-color: var(--border-glow);
      transform: translateY(-5px);
      box-shadow: 0 12px 40px 0 rgba(56, 189, 248, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1.75rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      transition: var(--transition);
      border: none;
    }

    .btn-primary {
      background: var(--gradient-primary);
      color: #fff;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 25px rgba(56, 189, 248, 0.5);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-glow);
    }

    .btn-outline:hover {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-cyan);
      transform: translateY(-2px);
    }

    /* -------------------------------------------------------------------------- */
    /* NAVIGATION BAR                                                             */
    /* -------------------------------------------------------------------------- */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      transition: var(--transition);
      padding: 1.25rem 0;
    }

    .navbar.scrolled {
      background: rgba(10, 14, 23, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      padding: 0.85rem 0;
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      text-decoration: none;
      font-family: var(--font-code);
    }

    .logo span {
      color: var(--accent-cyan);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: var(--transition);
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--accent-cyan);
    }

    .theme-toggle {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.5rem;
      transition: var(--transition);
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* -------------------------------------------------------------------------- */
    /* HERO SECTION                                                               */
    /* -------------------------------------------------------------------------- */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-top: 5rem;
      position: relative;
    }

    .hero-content {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 4rem;
      align-items: center;
    }

    .hero-text h3 {
      font-size: 1.25rem;
      color: var(--accent-cyan);
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-family: var(--font-code);
    }

    .hero-text h1 {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    .hero-text h2 {
      font-size: 1.5rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      font-weight: 500;
    }

    .typing-text {
      color: var(--accent-cyan);
      border-right: 2px solid var(--accent-cyan);
      white-space: nowrap;
      animation: blink 0.75s step-end infinite;
    }

    @keyframes blink {
      from, to { border-color: transparent }
      50% { border-color: var(--accent-cyan); }
    }

    .hero-text p {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 2rem;
      max-width: 550px;
    }

    .hero-btns {
      display: flex;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .social-links {
      display: flex;
      gap: 1.25rem;
    }

    .social-links a {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      transition: var(--transition);
      background: rgba(255, 255, 255, 0.02);
    }

    .social-links a:hover {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      transform: translateY(-3px);
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.25);
    }

    .hero-avatar {
      position: relative;
      display: flex;
      justify-content: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      padding: 8px;
      background: var(--gradient-primary);
      box-shadow: 0 0 50px rgba(37, 99, 235, 0.3);
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background-color: var(--bg-dark);
    }

    /* -------------------------------------------------------------------------- */
    /* ABOUT ME                                                                   */
    /* -------------------------------------------------------------------------- */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: center;
    }

    .about-text p {
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      font-size: 1.05rem;
    }

    .about-highlights {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .highlight-card {
      padding: 1.25rem;
      border-left: 3px solid var(--accent-cyan);
    }

    .highlight-card h4 {
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
    }

    .highlight-card p {
      font-size: 0.9rem;
      color: var(--text-dim);
      margin: 0;
    }

    /* -------------------------------------------------------------------------- */
    /* SKILLS SECTION                                                             */
    /* -------------------------------------------------------------------------- */
    .skills-categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
    }

    .skill-category h3 {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--accent-cyan);
    }

    .skill-item {
      margin-bottom: 1.25rem;
    }

    .skill-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.4rem;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .skill-bar {
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
    }

    .skill-progress {
      height: 100%;
      background: var(--gradient-primary);
      width: 0;
      border-radius: 4px;
      transition: width 1.5s cubic-bezier(0.1, 0.5, 0.5, 1);
    }

    .tools-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .tool-tag {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      border-radius: 50px;
      font-size: 0.9rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: var(--transition);
    }

    .tool-tag:hover {
      border-color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.15);
      transform: translateY(-2px);
    }

    /* -------------------------------------------------------------------------- */
    /* PROJECTS SECTION                                                           */
    /* -------------------------------------------------------------------------- */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 2rem;
    }

    .project-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 0;
    }

    .project-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-bottom: 1px solid var(--border-color);
    }

    .project-content {
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .project-title {
      font-size: 1.3rem;
      margin-bottom: 0.75rem;
    }

    .project-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
      flex: 1;
    }

    .project-tech {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .tech-pill {
      font-size: 0.75rem;
      font-family: var(--font-code);
      background: rgba(37, 99, 235, 0.15);
      color: var(--accent-cyan);
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
    }

    .project-links {
      display: flex;
      gap: 1rem;
    }

    .project-links .btn {
      padding: 0.5rem 1.25rem;
      font-size: 0.85rem;
    }

    /* -------------------------------------------------------------------------- */
    /* EXPERIENCE & EDUCATION                                                     */
    /* -------------------------------------------------------------------------- */
    .timeline {
      position: relative;
      max-width: 800px;
      margin: 0 auto;
    }

    .timeline::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20px;
      height: 100%;
      width: 2px;
      background: var(--border-color);
    }

    .timeline-item {
      position: relative;
      padding-left: 60px;
      margin-bottom: 2.5rem;
    }

    .timeline-dot {
      position: absolute;
      left: 11px;
      top: 5px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--bg-dark);
      border: 3px solid var(--accent-cyan);
    }

    .timeline-date {
      font-size: 0.85rem;
      font-family: var(--font-code);
      color: var(--accent-cyan);
      margin-bottom: 0.4rem;
    }

    /* -------------------------------------------------------------------------- */
    /* CERTIFICATIONS & ACHIEVEMENTS                                              */
    /* -------------------------------------------------------------------------- */
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .icon-box {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--accent-cyan);
      margin-bottom: 1.25rem;
    }

    /* -------------------------------------------------------------------------- */
    /* GITHUB STATS                                                               */
    /* -------------------------------------------------------------------------- */
    .github-stats-wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      text-align: center;
    }

    .stat-card h3 {
      font-size: 2.5rem;
      color: var(--accent-cyan);
      margin-bottom: 0.25rem;
      font-family: var(--font-code);
    }

    /* -------------------------------------------------------------------------- */
    /* TESTIMONIALS & BLOG                                                        */
    /* -------------------------------------------------------------------------- */
    .testimonial-card p {
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .testimonial-user {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .testimonial-user img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
    }

    .testimonial-user h5 {
      font-size: 0.95rem;
      margin-bottom: 0.1rem;
    }

    .testimonial-user span {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    /* -------------------------------------------------------------------------- */
    /* CONTACT SECTION                                                            */
    /* -------------------------------------------------------------------------- */
    .contact-wrapper {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 3rem;
    }

    .contact-info-item {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      transition: var(--transition);
    }

    .form-control:focus {
      border-color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.05);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 120px;
    }

    /* -------------------------------------------------------------------------- */
    /* FOOTER & BACK TO TOP                                                       */
    /* -------------------------------------------------------------------------- */
    footer {
      border-top: 1px solid var(--border-color);
      padding: 3rem 0 2rem 0;
      background: rgba(5, 8, 15, 0.9);
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .footer-bottom {
      text-align: center
      color: var(--text-dim);
      font-size: 0.9rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 1.5rem;
    }

    .back-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
